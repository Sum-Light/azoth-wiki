  <style>:root{color-scheme:dark;--bg:#111b1d;--panel:#1c2c2f;--line:#304044;--text:#e6eeeb;--muted:#91a7a5;--mint:#b2edce;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
button,input,select{font:inherit;-webkit-tap-highlight-color:transparent}
button,select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:9px 14px;font-size:13px;cursor:pointer}
button:hover:not(:disabled){background:#304549}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
button.primary{background:var(--mint);color:#142b25;border:0;font-weight:600}
a{color:var(--muted);text-decoration:none}
main{max-width:744px;margin:22px auto;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.player-heading{display:flex;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:15px;font-weight:500;margin:0;letter-spacing:1px}
#status-dot{width:5px;height:5px;border-radius:50%;background:var(--mint)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.console{min-width:0}
.screen-wrap{position:relative;overflow:hidden;background:#000;border:1px solid var(--line);border-radius:6px}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;background:#000;outline:none}
.screen-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#142225;text-align:center;padding:18px}
.screen-overlay[hidden]{display:none}
.screen-overlay p{margin:0;font-size:16px}
.screen-overlay>span{font-size:12px;line-height:1.7;color:var(--muted);max-width:460px;overflow-wrap:anywhere}
.screen-overlay p:empty,.screen-overlay>span:empty{display:none}
.screen-overlay button{min-width:112px}
.toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0}
.toolbar button{padding:9px 4px}
.touch-controls{display:none}
.more-panel{margin-top:12px;border-top:1px solid var(--line);font-size:12px}
summary{cursor:pointer;color:var(--muted);padding:13px 0;min-height:44px}
.settings-row{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.settings-row input{min-width:40px;flex:1;accent-color:var(--mint)}
.settings-row select{min-width:70px}
.extra-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.extra-actions button{padding:9px 5px;font-size:12px}
#save-status{display:block;color:var(--muted);font-size:11px;margin:12px 0}
.key-guide summary{padding:10px 0}
.key-guide p{margin:0 0 12px;line-height:2;color:var(--muted);font-size:11px}
footer{display:flex;justify-content:space-between;gap:10px;padding:10px 0;color:var(--muted);font-size:10px}
#toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;border:1px solid #557a69;border-radius:8px;background:#203b31;color:#dbf2e6;padding:12px 16px;font-size:12px;line-height:1.6;max-width:calc(100vw - 24px);width:max-content;overflow-wrap:anywhere;pointer-events:none}
dialog{border:1px solid #59766d;border-radius:12px;padding:22px;color:var(--text);background:#1d3031;max-width:min(420px,calc(100vw - 28px))}
dialog::backdrop{background:#041011bb}
dialog h2{font-size:17px;font-weight:500;margin:0}
dialog p{font-size:13px;color:var(--muted);line-height:1.8;margin:16px 0 22px}
dialog>div{display:flex;justify-content:flex-end;gap:10px}
.player-immersive,.player-immersive body{overflow:hidden;overscroll-behavior:none}
.player-area.is-fullscreen,.player-area.is-landscape{position:fixed;inset:0;z-index:10;width:var(--player-width,100vw);height:var(--player-height,100dvh);max-width:none;max-height:none;background:var(--bg);padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}
.player-area.is-fullscreen .player-heading,.player-area.is-fullscreen .more-panel,.player-area.is-landscape .player-heading,.player-area.is-landscape .more-panel{display:none}
.player-area.is-fullscreen .console{flex:none;width:min(100%,calc((var(--player-height,100dvh) - 90px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*1.5))}
.player-area.is-fullscreen .toolbar,.player-area.is-fullscreen .touch-controls{flex:none;width:min(100%,720px)}
.has-touch .touch-controls{display:block;user-select:none;-webkit-user-select:none;padding:4px 2px 0}
.has-touch .touch-controls button{touch-action:none;user-select:none;font-weight:600;background:#293d40;color:#c9e0d6}
.has-touch .touch-controls button.pressed{background:#618977}
.has-touch .shoulders{display:flex;justify-content:space-between;margin-bottom:12px}
.has-touch .shoulders button{width:80px}
.has-touch .controller{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px 20px}
.has-touch .dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
.has-touch .dpad button{min-width:42px;min-height:42px;padding:0;border-radius:6px;font-size:13px}
.has-touch .dpad button:nth-child(1){grid-column:2}
.has-touch .dpad button:nth-child(2){grid-row:2;grid-column:1}
.has-touch .dpad span{grid-row:2;grid-column:2;background:#293d40}
.has-touch .dpad button:nth-child(4){grid-row:2;grid-column:3}
.has-touch .dpad button:nth-child(5){grid-row:3;grid-column:2}
.has-touch .action-keys{grid-column:2;grid-row:1;justify-self:end;display:flex;gap:10px;align-items:center}
.has-touch .action-keys button{width:52px;height:52px;border-radius:50%;font-size:20px}
.has-touch .action-keys button:last-child{background:#88b8a0;color:#10291e;transform:translateY(-16px)}
.has-touch .action-keys button.pressed{background:#c4f4d8}
.has-touch .system-keys{grid-column:1/-1;grid-row:2;display:flex;justify-content:center;gap:12px}
.has-touch .system-keys button{min-width:76px;font-size:10px;letter-spacing:.5px}
.player-area.is-fullscreen.has-touch:not(.is-landscape) .console{width:min(100%,calc(max(1px,var(--player-height,100dvh) - 330px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*1.5))}
.player-area.is-landscape{--side-width:clamp(100px,16vw,140px);display:grid;grid-template-columns:var(--side-width) minmax(0,1fr) var(--side-width);grid-template-rows:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.is-landscape .console{grid-column:2;grid-row:1/3;justify-self:center;width:min(100%,calc((var(--player-height,100dvh) - 70px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*1.5))!important}
.is-landscape .toolbar{grid-column:2;grid-row:3;width:100%;margin:0;gap:4px}
.is-landscape .toolbar button{padding:8px 2px;font-size:12px;min-width:0}
.is-landscape .touch-controls,.is-landscape .shoulders,.is-landscape .controller,.is-landscape .system-keys{display:contents}
.is-landscape .shoulders button:first-child{grid-column:1;grid-row:1;justify-self:center;width:80px}
.is-landscape .shoulders button:last-child{grid-column:3;grid-row:1;justify-self:center;width:80px}
.is-landscape .dpad{grid-column:1;grid-row:2;justify-self:center;grid-template-columns:repeat(3,min(40px,calc(var(--side-width)/3)));grid-template-rows:repeat(3,min(40px,calc(var(--side-width)/3)))}
.is-landscape .dpad button{min-width:0;min-height:0}
.is-landscape .action-keys{grid-column:3;grid-row:2;justify-self:center;gap:5px}
.is-landscape .action-keys button{width:44px;height:44px;padding:0}
.is-landscape .system-keys button:first-child{grid-column:1;grid-row:3;justify-self:center;min-width:80px}
.is-landscape .system-keys button:last-child{grid-column:3;grid-row:3;justify-self:center;min-width:80px}
.is-landscape .screen-wrap{border-radius:4px}
@media(max-width:700px){main{margin:12px auto}.toolbar{gap:6px}}



/* Direction icons: geometric shapes avoid platform emoji substitution. */
.has-touch .dpad button{display:grid;place-items:center}
.has-touch .dpad button::before{content:"";width:0;height:0;border:6px solid transparent;pointer-events:none}
.has-touch .dpad [data-key="Up"]::before{border-top:0;border-bottom:10px solid currentColor}
.has-touch .dpad [data-key="Down"]::before{border-bottom:0;border-top:10px solid currentColor}
.has-touch .dpad [data-key="Left"]::before{border-left:0;border-right:10px solid currentColor}
.has-touch .dpad [data-key="Right"]::before{border-right:0;border-left:10px solid currentColor}
/* Keep iOS selection/callout gestures out of repeated game input. */
.player-area,.player-area *,html.player-immersive,html.player-immersive body,html.player-immersive main{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.player-area input,.player-area textarea,.player-area [contenteditable]:not([contenteditable="false"]){-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.player-area.is-landscape,.player-area.is-fullscreen,.touch-controls,.touch-controls *{touch-action:none}
.player-area button,.player-area summary{touch-action:manipulation}
.player-area canvas,.player-area .touch-controls button{touch-action:none}
/* End direction icons. */
</style>

async function valid(data, item) {
  return data.byteLength === item.bytes && await digest(data) === item.sha256;
}

function download(item, attempt) {
  const ordered = sources.map((_, index) => (preferredSource + index) % sources.length);
  const controllers = [], timers = [], received = new Map();
  let next = 0, active = 0, settled = false, lastError;
  const key = absolute(item);
  return new Promise((resolve, reject) => {
    const finish = () => {
      for (const timer of timers) clearTimeout(timer);
      for (const controller of controllers) controller.abort();
    };
    const launch = () => {
      if (settled || next >= ordered.length) return;
      const sourceIndex = ordered[next++];
      const controller = new AbortController(); controllers.push(controller);
      if (next > 1) metrics.failovers++;
      active++;
      // A slow connection races another route; the first verified block wins.
      timers.push(setTimeout(launch, 8000));
      (async () => {
        let timeout;
        const activity = () => {
          clearTimeout(timeout);
          timeout = setTimeout(() => controller.abort(), 20000);
        };
        activity();
        try {
          const url = new URL(item.url, new URL(sources[sourceIndex], location.href)).href;
          const response = await fetch(url, {signal: controller.signal, cache: attempt ? 'reload' : 'default', credentials: 'omit'});
          if (!response.ok) throw new Error('下载失败');
          activity();
          const bytes = new Uint8Array(item.bytes);
          let offset = 0;
          if (response.body) {
            const reader = response.body.getReader();
            while (true) {
              const {done, value} = await reader.read();
              if (done) break;
              activity(); metrics.networkBytes += value.length;
              if (offset + value.length > bytes.length) throw new Error('资源长度不符');
              bytes.set(value, offset); offset += value.length;
              received.set(sourceIndex, offset);
              downloaded.set(key, Math.max(...received.values())); progress();
            }
          } else {
            const raw = new Uint8Array(await response.arrayBuffer());
            metrics.networkBytes += raw.length;
            if (raw.length !== bytes.length) throw new Error('资源长度不符');
            bytes.set(raw); offset = raw.length;
          }
          if (offset !== item.bytes || !await valid(bytes, item)) throw new Error('资源校验失败');
          if (settled) return;
          settled = true; preferredSource = sourceIndex;
          metrics.sourceWins[sources[sourceIndex]] = (metrics.sourceWins[sources[sourceIndex]] || 0) + 1;
          finish(); resolve(bytes);
        } catch (error) {
          if (settled) return;
          lastError = error; active--;
          if (next < ordered.length) launch();
          else if (!active) { settled = true; finish(); reject(lastError); }
        } finally { clearTimeout(timeout); }
      })();
    };
    launch();
  });
}

async function load(item) {
  const url = absolute(item);
  try {
    const existing = await storage(cache?.match(url));
    if (existing) {
      const bytes = new Uint8Array(await storage(existing.arrayBuffer()));
      if (await valid(bytes, item)) {
        metrics.cachedBytes += bytes.length;
        downloaded.set(url, bytes.length); progress(); return bytes;
      }
      await storage(cache.delete(url));
    }
  } catch { /* Storage being unavailable must not block play. */ }
  for (let attempt = 0; attempt < 3; attempt++) {
    downloaded.set(url, 0);
    try {
      const bytes = await download(item, attempt);
      try { await storage(cache?.put(url, new Response(bytes, {headers: {'Content-Type': 'application/octet-stream'}}))); }
      catch { /* Quota/privacy failures only disable this optional cache write. */ }
      downloaded.set(url, bytes.length); progress(); return bytes;
    } catch (error) {
      if (attempt === 2) throw new Error('下载中断，请重试（已下载部分会保留）');
      metrics.retries++;
      await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
    }
  }
}

async function decompress(parts) {
  return new Uint8Array(await new Response(new Blob(parts).stream()
    .pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
}

const loaded = new Map();
globalThis.AZOTH_STANDALONE = {
  assetURL(name) { return urls.get(name); },
  rom() {
    if (!romPromise) romPromise = (async () => {
      const data = await decompress(payload.romChunks.map(item => loaded.get(item.url)));
      if (data.length !== payload.manifest.bytes || await digest(data) !== payload.manifest.sha256)
        throw new Error('游戏校验失败，请刷新重试');
      return data;
    })();
    return romPromise;
  },
  sdk: () => import(moduleURL('mgba.sdk.js')),
  async createAudioSink(context, source) {
    const audio = await import(moduleURL('standalone-audio.mjs'));
    return audio.createAudioSink(context, source);
  },
  core: () => import(moduleURL('standalone-core.mjs')),
  async fetch(url) {
    if (url === 'manifest.json') return new Response(JSON.stringify(payload.manifest), {headers: {'Content-Type': 'application/json'}});
    if (url === payload.manifest.rom) return new Response(await this.rom());
    throw new Error('找不到游戏资源');
  },
};

async function prepare() {
  $('start').disabled = true; $('start').textContent = '连接中';
  $('overlay-title').textContent = ''; $('overlay-detail').textContent = '';
  delete document.documentElement.dataset.ready;
  try {
    if (!globalThis.DecompressionStream || !globalThis.crypto?.subtle)
      throw new Error('请使用新版浏览器，通过 HTTPS 打开');
    try { cache = await storage(caches.open(cacheName)); } catch { cache = null; }
    let next = 0, failure;
    // Finish current downloads on failure so retry can reuse their verified bytes.
    await Promise.all(Array.from({length: 6}, async () => {
      while (!failure && next < resources.length) {
        const item = resources[next++];
        if (loaded.has(item.url)) continue;
        try { loaded.set(item.url, await load(item)); } catch (error) { failure = error; }
      }
    }));
    if (failure) throw failure;
    for (const [name, item] of Object.entries(payload.assets)) {
      if (!urls.has(name)) urls.set(name, blobURL(await decompress([loaded.get(item.url)]),
        name.endsWith('.wasm') ? 'application/wasm' : 'text/javascript'));
    }
    // The original app binds its start handler only after all downloads finish.
    $('start').onclick = null;
    await import(moduleURL('app.mjs'));
    metrics.readyAt = performance.now();
    document.documentElement.dataset.ready = 'true';
  } catch (error) {
    $('overlay-detail').textContent = error.message;
    $('start').textContent = '重试'; $('start').disabled = false;
    $('start').onclick = prepare;
  }
}
document.documentElement.dataset.shellReady = 'true';
document.querySelector('footer a').href = new URL(payload.license, location.href).href;
await prepare();
</script>
