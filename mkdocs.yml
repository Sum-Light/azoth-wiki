site_name: 宝可梦水银 百科
site_description: 宝可梦水银 (Project Azoth) 非官方资料站

theme:
  name: material
  language: zh
  palette:
    primary: blue grey
  features:
    - navigation.instant
    - navigation.top
    - search.highlight
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 宝可梦图鉴: pokemon/index.md
