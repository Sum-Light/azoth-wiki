site_name: 宝可梦水银 百科
site_description: 宝可梦水银 (Project Azoth) 非官方资料站

hooks:
  - hooks/map_publication.py
  - hooks/pokedex.py

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - content.tabs.link

plugins:
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css
  - stylesheets/sidequests.css
  - stylesheets/locations.css
  - stylesheets/encyclopedia.css
  - stylesheets/pokedex.css
  - stylesheets/pixel-images.css

extra_javascript:
  - javascripts/sidequests.js
  - javascripts/locations.js
  - javascripts/encyclopedia.js
  - javascripts/pokedex.js
  - javascripts/pixel-images.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 支线任务: sidequests/index.md
  - 公告: news/index.md
  - 宝可梦图鉴: pokemon/index.md
  - 招式一览: moves/index.md
  - 招式学习机: machines/index.md
  - 定点教学: tutors/index.md
  - 特性一览: abilities/index.md
  - 道具一览: items/index.md
  - 地点分布: locations/index.md
  - 查看地图: locations/atlas.md
  - 广播: broadcast/index.md
  - 时间事件: events/index.md
  - 存档修复: savefix/index.md
  - 水银HOME: home/index.md
  - 配信: distribution/index.md
  - BUG反馈: https://docs.qq.com/sheet/DUHRRdnNGYVZmRW5t?aidPos=detail&no_promotion=1&is_blank_or_template=blank&tab=BB08J2
